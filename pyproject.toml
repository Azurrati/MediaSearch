[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MediaSearch"
version = "0.1.0"
description = "A tool that extracts and searches for text in Image, Video, and Audio files."
requires-python = ">=3.10"

dependencies = [
    "rapidfuzz>=3.13.0",
    "paddleocr>=3.4.0",
    "pytesseract>=0.3.13",
    "faster-whisper>=1.2.1",
    "easyocr>=1.7.2",
    "opencv-python>=4.11.0.86",
    "rich>=14.2.0"
]